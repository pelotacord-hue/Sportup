name: SportUp APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install SDK
        shell: bash
        run: |
          set +o pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Listar arquivos do repositório
        run: ls -la

      - name: Extract project
        run: |
          ZIP=$(find . -maxdepth 2 -name "SportUp-Android-Studio.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERRO: zip não encontrado no repositório"
            exit 1
          fi
          mkdir -p projeto
          unzip -q "$ZIP" -d projeto

      - name: Build APK
        run: |
          DIR=$(dirname "$(find projeto -name 'settings.gradle*' | head -n 1)")
          echo "Projeto em: $DIR"
          cd "$DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SportUp-APK
          path: projeto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
